<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号配置 · Embeat</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script>
    (() => { try { const value = localStorage.getItem('embeat_ui_theme_v1'); document.documentElement.dataset.theme = ['auto', 'studio', 'night', 'ocean', 'contrast', 'forest', 'berry', 'graphite', 'solar'].includes(value) ? value : 'auto'; } catch (error) { document.documentElement.dataset.theme = 'auto'; } })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="settings-page">
  <div class="app-shell">
    <aside class="sidebar settings-sidebar">
      <div class="brand-row"><a class="brand" href="/"><img class="brand-mark" src="/logo.svg" alt="Embeat logo" width="38" height="38"><div><strong>Embeat</strong><small>Account Settings</small></div></a><div class="theme-picker" data-theme-picker><button class="theme-picker-button" type="button" title="切换界面主题" aria-label="切换界面主题" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">◐</span></button><div class="theme-menu hidden" role="menu" aria-label="界面主题"></div></div></div>
      <nav class="radio-nav" aria-label="页面导航">
        <a href="/">歌曲推荐</a>
        <a href="/radio">歌单电台</a>
        <a class="active" href="/settings" aria-current="page">平台账号</a>
      </nav>
      <div class="service-status" id="settings-service-status"><span class="status-dot"></span><div><strong>正在连接</strong><small>Embeat</small></div></div>
    </aside>

    <main class="workspace settings-workspace">
      <header class="topbar"><div><p class="eyebrow">Platform Accounts</p><h1>平台账号配置</h1></div><div class="topbar-meta">按当前 Embeat 用户隔离</div></header>
      <div class="settings-grid">
        <section class="settings-platform" data-platform="netease">
          <div class="settings-platform-header"><div><p class="eyebrow">NetEase Cloud Music</p><h2>网易云音乐</h2></div><span class="settings-state" data-role="state">未连接</span></div>
          <div class="settings-fields">
            <label>兼容 API 地址<input data-role="api" class="light-input" placeholder="https://your-netease-api.example.com" autocomplete="off"></label>
            <label>HTTP 代理<input data-role="proxy" class="light-input" placeholder="可留空" autocomplete="off"></label>
          </div>
          <form class="settings-method" data-role="cookie-form">
            <div class="settings-method-title"><strong>Cookie 连接</strong><small>保存后不再回显</small></div>
            <label>Cookie<textarea data-role="cookie" class="light-input cookie-input" autocomplete="off" required></textarea></label>
            <button class="primary-button" type="submit">校验并保存</button>
          </form>
          <form class="settings-method" data-role="phone-form">
            <div class="settings-method-title"><strong>手机验证码登录</strong><small>中国大陆默认 +86</small></div>
            <div class="settings-phone-row"><label>区号<input data-role="country" class="light-input" value="86" inputmode="numeric"></label><label>手机号<input data-role="phone" class="light-input" inputmode="tel" autocomplete="tel" required></label><button data-role="send" class="secondary-button" type="button">发送验证码</button></div>
            <div class="settings-code-row"><label>验证码<input data-role="code" class="light-input" inputmode="numeric" autocomplete="one-time-code" required></label><button class="primary-button" type="submit">登录并保存</button></div>
          </form>
          <button class="forget-button" data-role="clear" type="button">清除网易云凭据</button>
        </section>

        <section class="settings-platform" data-platform="kugou">
          <div class="settings-platform-header"><div><p class="eyebrow">KuGou Music</p><h2>酷狗音乐</h2></div><span class="settings-state" data-role="state">未连接</span></div>
          <div class="settings-fields">
            <label>兼容 API 地址<input data-role="api" class="light-input" placeholder="https://your-kugou-api.example.com" autocomplete="off"></label>
            <label>HTTP 代理<input data-role="proxy" class="light-input" placeholder="可留空" autocomplete="off"></label>
          </div>
          <form class="settings-method" data-role="cookie-form">
            <div class="settings-method-title"><strong>Cookie 连接</strong><small>需包含 token 与 userid</small></div>
            <label>Cookie<textarea data-role="cookie" class="light-input cookie-input" autocomplete="off" required></textarea></label>
            <button class="primary-button" type="submit">校验并保存</button>
          </form>
          <form class="settings-method" data-role="phone-form">
            <div class="settings-method-title"><strong>手机验证码登录</strong><small>由酷狗 API 发送</small></div>
            <input data-role="country" type="hidden" value="86">
            <div class="settings-phone-row kugou-phone-row"><label>手机号<input data-role="phone" class="light-input" inputmode="tel" autocomplete="tel" required></label><button data-role="send" class="secondary-button" type="button">发送验证码</button></div>
            <div class="settings-code-row"><label>验证码<input data-role="code" class="light-input" inputmode="numeric" autocomplete="one-time-code" required></label><button class="primary-button" type="submit">登录并保存</button></div>
          </form>
          <button class="forget-button" data-role="clear" type="button">清除酷狗凭据</button>
        </section>
      </div>
      <div id="settings-toast" class="toast hidden" role="alert"></div>
    </main>
  </div>
  <script src="/auth-gate.js"></script>
  <script src="/theme-picker.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
